name: Publish Arong to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified artwork
        run: node scripts/restore-assets.mjs
      - name: Store artwork in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          if ! git diff --cached --quiet; then
            git commit -m "Store verified Arong game artwork"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pages
      - name: Keep branch-based Pages identical to the game
        run: |
          cp -r pages-dist/assets .
          cp -r pages-dist/images .
          cp pages-dist/index.html .
          cp pages-dist/favicon.svg .
          touch .nojekyll pages-dist/.nojekyll
          git add index.html favicon.svg .nojekyll assets images
          if ! git diff --cached --quiet; then
            git commit -m "Publish built game at repository root"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
